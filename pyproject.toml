[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-metrics-opentelemetry"
version = "0.1.0a1"
description = "Optional OpenTelemetry Metrics exporter for Orbit Core metric snapshots."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "orbit-core>=0.1.0a1,<0.2",
  "orbit-metrics>=0.1.0a1,<0.2",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
otlp-http = ["opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
otlp-grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.45,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<3", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_metrics_opentelemetry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_metrics_opentelemetry"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
follow_imports = "skip"
